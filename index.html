<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lead On — A Leadership Game in Three Phases</title>
<style>
:root {
  --bg: #0f1420;
  --panel: #171e2e;
  --panel-2: #1f2940;
  --text: #e8ecf4;
  --muted: #9aa7bd;
  --accent: #f0b429;
  --accent-2: #4f8cff;
  --good: #3ecf8e;
  --bad: #ff6b6b;
  --border: #2a3550;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  background: radial-gradient(1200px 600px at 50% -10%, #1d2a4a 0%, var(--bg) 60%);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 16px 48px;
}
header { text-align: center; margin-bottom: 18px; }
header h1 { font-size: 2rem; letter-spacing: 0.5px; }
header h1 span { color: var(--accent); }
header p { color: var(--muted); margin-top: 4px; }
#steps { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; justify-content: center; }
.step {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 14px; border: 1px solid var(--border); border-radius: 999px;
  color: var(--muted); font-size: 0.9rem; background: var(--panel);
}
.step .dot {
  width: 22px; height: 22px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--panel-2); border: 1px solid var(--border); font-size: 0.8rem;
}
.step.active { color: var(--text); border-color: var(--accent); }
.step.active .dot { background: var(--accent); color: #1a1a1a; border-color: var(--accent); font-weight: 700; }
.step.done { color: var(--good); }
.step.done .dot { background: var(--good); color: #0c1f16; border-color: var(--good); }
#stats {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px; width: 100%; max-width: 760px; margin-bottom: 18px;
}
.stat { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
.stat-head { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
.stat-head span:last-child { color: var(--text); font-weight: 600; }
.bar { height: 8px; background: var(--panel-2); border-radius: 999px; overflow: hidden; }
.fill { height: 100%; border-radius: 999px; transition: width 0.35s ease; }
#screen { width: 100%; max-width: 760px; }
.card {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 16px; padding: 26px;
}
.card.center { text-align: center; }
.card h2 { margin-bottom: 10px; font-size: 1.4rem; }
.kicker { color: var(--accent); text-transform: uppercase; letter-spacing: 1.5px; font-size: 0.75rem; margin-bottom: 8px; }
.lead { color: var(--muted); line-height: 1.6; margin-bottom: 18px; }
.lead b { color: var(--text); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; margin-bottom: 18px; }
.cand {
  background: var(--panel-2); border: 1px solid var(--border); border-radius: 12px;
  padding: 14px; display: flex; flex-direction: column; gap: 6px;
}
.cand.picked { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.cand-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.role { font-size: 0.72rem; color: var(--accent-2); border: 1px solid var(--accent-2); border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
.cand p { font-size: 0.85rem; color: var(--muted); flex: 1; }
.bonus { color: var(--good) !important; font-size: 0.78rem !important; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
#pickinfo { color: var(--muted); font-size: 0.9rem; }
.btn {
  border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
  border-radius: 10px; padding: 10px 18px; font-size: 0.95rem; cursor: pointer;
  transition: transform 0.08s ease, background 0.15s ease;
}
.btn:hover:not(:disabled) { transform: translateY(-1px); background: #273252; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #1a1a1a; font-weight: 700; }
.btn.primary:hover:not(:disabled) { background: #ffc94d; }
.btn.small { padding: 7px 12px; font-size: 0.82rem; width: 100%; }
.btn.ghost { background: transparent; }
.choices { display: flex; flex-direction: column; gap: 10px; }
.choice {
  text-align: left; background: var(--panel-2); border: 1px solid var(--border);
  color: var(--text); border-radius: 12px; padding: 14px 16px; font-size: 0.95rem;
  cursor: pointer; display: flex; flex-direction: column; gap: 4px; line-height: 1.45;
  transition: border-color 0.15s ease, background 0.15s ease;
}
.choice:hover:not(:disabled) { border-color: var(--accent); background: #273252; }
.choice:disabled { opacity: 0.5; cursor: not-allowed; }
.choice small { color: var(--accent-2); font-size: 0.78rem; }
.choice.locked small { color: var(--bad); }
.deltas { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.deltas span { border-radius: 999px; padding: 4px 12px; font-size: 0.82rem; border: 1px solid var(--border); }
.up { color: var(--good); }
.down { color: var(--bad); }
.score { font-size: 1.05rem; margin-bottom: 12px; }
.muted { color: var(--muted); font-size: 0.88rem; margin-bottom: 18px; }
.final-stats { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; margin-bottom: 14px; color: var(--muted); font-size: 0.9rem; }
.final-stats b { color: var(--text); }
footer { margin-top: 26px; color: var(--muted); font-size: 0.8rem; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Lead <span>On</span></h1>
  <p>A leadership game in three phases</p>
</header>
<div id="steps"></div>
<div id="stats"></div>
<div id="screen"></div>
<footer>Assemble your team. Lead through the crises. Leave your legacy.</footer>
<script>
const ROLE_NAMES = { strategist: "Strategist", diplomat: "Diplomat", fighter: "Vanguard", medic: "Medic", scout: "Scout", engineer: "Engineer" };
const STAT_LABELS = { morale: "Morale", trust: "Trust", rep: "Reputation", budget: "Gold" };
const STAT_COLORS = { morale: "var(--good)", trust: "var(--accent-2)", rep: "var(--accent)", budget: "var(--accent)" };

const CANDIDATES = [
  { id: "ava", name: "Ava Storm", role: "Strategist", roleKey: "strategist", cost: 35, blurb: "Plans three moves ahead.", bonus: { trust: 4 } },
  { id: "ben", name: "Ben Hale", role: "Diplomat", roleKey: "diplomat", cost: 30, blurb: "Turns rivals into allies.", bonus: { morale: 4 } },
  { id: "cara", name: "Cara Vex", role: "Vanguard", roleKey: "fighter", cost: 30, blurb: "First into every battle.", bonus: { rep: 4 } },
  { id: "dex", name: "Dex Lyn", role: "Scout", roleKey: "scout", cost: 25, blurb: "Sees what others miss.", bonus: { rep: 4 } },
  { id: "mira", name: "Mira Quinn", role: "Medic", roleKey: "medic", cost: 25, blurb: "Keeps the team on its feet.", bonus: { morale: 4 } },
  { id: "ola", name: "Ola Brick", role: "Engineer", roleKey: "engineer", cost: 20, blurb: "Builds what the mission needs.", bonus: { budget: 6 } }
];

const CRISES = [
  {
    title: "Rumors in the tavern",
    text: "Word spreads that your band is falling apart. The whole town is talking.",
    choices: [
      { text: "Confront the rumor-mongers publicly.", role: "fighter", fx: { rep: 8, trust: -6, morale: -2 }, result: "The crowd roars your name — but some quietly wonder whether force was necessary." },
      { text: "Set the record straight with facts, one person at a time.", role: "strategist", fx: { trust: 8, rep: 2 }, result: "Slowly, patiently, the truth wins people over." },
      { text: "Ignore the gossip and double down on the mission.", fx: { morale: 4, rep: -6 }, result: "Your team respects your focus, but the rumors linger in the shadows." }
    ]
  },
  {
    title: "The treasury runs dry",
    text: "Budget cuts are announced. One of your projects must be cancelled today.",
    choices: [
      { text: "Cancel the weakest project and protect your people.", role: "diplomat", fx: { morale: 8, trust: 4, budget: -5 }, result: "The team notices who you chose to stand behind. Loyalty deepens." },
      { text: "Ask everyone to take a small pay cut together.", fx: { trust: 6, morale: -6, budget: 10 }, result: "Hardship shared is hardship halved — mostly." },
      { text: "Raid the emergency reserve and keep everything running.", fx: { budget: -15, morale: 4, rep: -2 }, result: "Everything keeps moving, but the elders frown at your recklessness." }
    ]
  },
  {
    title: "A costly mistake",
    text: "A teammate botches an important task in front of everyone. All eyes turn to you.",
    choices: [
      { text: "Forgive publicly, then coach privately.", role: "diplomat", fx: { trust: 10, morale: 4 }, result: "The mistake becomes a lesson instead of a scar. Trust grows." },
      { text: "Punish firmly to set an example.", role: "fighter", fx: { rep: 4, trust: -8, morale: -6 }, result: "Order is restored — at the price of fear in the ranks." },
      { text: "Absorb the blame yourself and fix the damage quietly.", role: "strategist", fx: { trust: 6, morale: 2, rep: -4 }, result: "No one loses face. The team owes you one." }
    ]
  },
  {
    title: "A public challenge",
    text: "A rival leader challenges you to a contest of skill in front of the whole town.",
    choices: [
      { text: "Accept — and let your Strategist plan every move.", role: "strategist", fx: { rep: 10, trust: 2, morale: 2 }, result: "You win with cleverness, not muscle. The crowd is impressed." },
      { text: "Decline, and invest the day in training instead.", fx: { trust: 6, morale: 4, rep: -4 }, result: "You look like a leader who plays the long game." },
      { text: "Send your Vanguard to compete in your place.", role: "fighter", fx: { rep: 6, morale: 4, trust: -4 }, result: "Your champion wins the day — but some say you hid behind them." }
    ]
  },
  {
    title: "The team is exhausted",
    text: "With the final push near, your people are running on empty.",
    choices: [
      { text: "Push through — the goal matters most.", fx: { rep: 8, morale: -10, trust: -4 }, result: "You win the day, but some eyes in the ranks look tired and hollow." },
      { text: "Declare a rest day so everyone can recover.", role: "medic", fx: { morale: 10, rep: -4 }, result: "A rested team fights twice as hard when it matters." },
      { text: "Host a small celebration of the wins so far.", role: "diplomat", fx: { morale: 8, trust: 6, budget: -5 }, result: "Laughter returns to the camp. People remember how you made them feel." }
    ]
  }
];

const FINALE = {
  title: "The final decision",
  text: "The realm's fate now rests on a single decision — and everyone is watching to see what kind of leader you truly are.",
  choices: [
    { text: "Lead the final charge yourself.", fx: { rep: 10, morale: 6, trust: 4 }, result: "You ride at the front. Whatever happens next, it happens with you." },
    { text: "Delegate to your team and stand behind them.", fx: { trust: 10, morale: 6, rep: 4 }, result: "You gave them the tools and the trust. Now you watch them shine." },
    { text: "Negotiate a peaceful resolution instead.", role: "diplomat", fx: { trust: 8, rep: 6, morale: 4 }, result: "Words instead of swords. Not everyone expected it — everyone remembers it." }
  ]
};

const ENDINGS = [
  { min: 240, title: "The Legendary Leader", text: "Songs are already being sung about your leadership. Morale, trust and reputation all stand tall — your name will outlive the game itself." },
  { min: 180, title: "The Respected Leader", text: "People follow you willingly and speak well of you. A solid, honorable legacy — the kind kingdoms are built on." },
  { min: 120, title: "The Steady Hand", text: "You kept things together when it counted, even if not every decision was popular. Leadership, at its core, is endurance." },
  { min: 0, title: "A Leader Still Learning", text: "Every great leader starts somewhere. The team is still with you — and that is where every legend begins." }
];

const state = { phase: 1, budget: 100, morale: 50, trust: 50, rep: 50, team: [], crisisIndex: 0 };
const screen = document.getElementById("screen");
const stepsEl = document.getElementById("steps");
const statsEl = document.getElementById("stats");

function clamp(v) { return Math.max(0, Math.min(100, v)); }

function teamRoles() {
  return new Set(state.team.map(id => CANDIDATES.find(c => c.id === id).roleKey));
}

function applyBonus(cand, sign) {
  Object.entries(cand.bonus).forEach(([k, v]) => {
    if (k === "budget") state.budget = Math.max(0, state.budget + sign * v);
    else state[k] = clamp(state[k] + sign * v);
  });
}

function renderSteps() {
  const names = ["Assemble", "Lead", "Legacy"];
  stepsEl.innerHTML = names.map((n, i) => {
    const p = i + 1;
    const cls = p === state.phase ? "step active" : (p < state.phase ? "step done" : "step");
    return `<div class="${cls}"><span class="dot">${p < state.phase ? "✓" : p}</span>${n}</div>`;
  }).join("");
}

function renderStats() {
  statsEl.innerHTML = ["morale", "trust", "rep", "budget"].map(k => {
    const v = k === "budget" ? state.budget : clamp(state[k]);
    const pct = k === "budget" ? Math.min(100, state.budget) : v;
    return `<div class="stat"><div class="stat-head"><span>${STAT_LABELS[k]}</span><span>${v}</span></div>
      <div class="bar"><div class="fill" style="width:${pct}%;background:${STAT_COLORS[k]}"></div></div></div>`;
  }).join("");
}

function renderAll() { renderSteps(); renderStats(); }

function renderAssemble() {
  state.phase = 1;
  screen.innerHTML = `
    <div class="card">
      <p class="kicker">Phase 1 of 3</p>
      <h2>Assemble your team</h2>
      <p class="lead">You are the new leader of a small band with <b>${state.budget} gold</b>. Recruit <b>exactly 3</b> companions — each role unlocks special options in the crises ahead.</p>
      <div class="grid" id="candidates"></div>
      <div class="row">
        <span id="pickinfo">Picked ${state.team.length} / 3 — ${state.budget} gold left</span>
        <button id="start2" class="btn primary" ${state.team.length === 3 ? "" : "disabled"}>Begin Phase 2 →</button>
      </div>
    </div>`;
  const grid = document.getElementById("candidates");
  CANDIDATES.forEach(c => {
    const picked = state.team.includes(c.id);
    const afford = picked || c.cost <= state.budget;
    const bonusText = Object.entries(c.bonus).map(([k, v]) => `+${v} ${STAT_LABELS[k]}`).join(", ");
    const card = document.createElement("div");
    card.className = "cand" + (picked ? " picked" : "");
    card.innerHTML = `
      <div class="cand-top"><b>${c.name}</b><span class="role">${c.role}</span></div>
      <p>${c.blurb}</p>
      <p class="bonus">Bonus: ${bonusText}</p>
      <button class="btn ${picked ? "ghost" : "small"}" ${afford ? "" : "disabled"}>
        ${picked ? "Remove — refund " + c.cost + " gold" : "Recruit — " + c.cost + " gold"}
      </button>`;
    card.querySelector("button").onclick = () => {
      if (state.team.includes(c.id)) {
        state.team = state.team.filter(id => id !== c.id);
        applyBonus(c, -1);
      } else {
        state.team.push(c.id);
        applyBonus(c, 1);
      }
      renderAssemble();
      renderAll();
    };
    grid.appendChild(card);
  });
  document.getElementById("start2").onclick = () => { state.crisisIndex = 0; renderLeadIntro(); };
  renderAll();
}

function renderLeadIntro() {
  state.phase = 2;
  screen.innerHTML = `
    <div class="card center">
      <p class="kicker">Phase 2 of 3</p>
      <h2>Lead through the crises</h2>
      <p class="lead">Five crises will test your leadership. Every choice shapes <b>Morale</b>, <b>Trust</b> and <b>Reputation</b> — and some options require a specific companion on your team.</p>
      <button class="btn primary" id="go">Face the first crisis →</button>
    </div>`;
  document.getElementById("go").onclick = () => renderCrisis();
  renderAll();
}

function renderCrisis() {
  state.phase = 2;
  const c = CRISES[state.crisisIndex];
  const roles = teamRoles();
  screen.innerHTML = `
    <div class="card">
      <p class="kicker">Phase 2 — Crisis ${state.crisisIndex + 1} of ${CRISES.length}</p>
      <h2>${c.title}</h2>
      <p class="lead">${c.text}</p>
      <div class="choices" id="choices"></div>
    </div>`;
  const box = document.getElementById("choices");
  c.choices.forEach(ch => {
    const has = ch.role && roles.has(ch.role);
    const btn = document.createElement("button");
    btn.className = "choice" + (ch.role && !has ? " locked" : "");
    btn.disabled = !!(ch.role && !has);
    btn.innerHTML = `${ch.text}${ch.role ? `<small>${has ? "Unlocked — your " + ROLE_NAMES[ch.role] + " advises this" : "Requires a " + ROLE_NAMES[ch.role] + " on your team"}</small>` : ""}`;
    btn.onclick = () => applyChoice(ch, "crisis");
    box.appendChild(btn);
  });
  renderAll();
}

function applyChoice(ch, source) {
  ["morale", "trust", "rep"].forEach(k => { if (ch.fx[k]) state[k] = clamp(state[k] + ch.fx[k]); });
  if (ch.fx.b) state.budget = Math.max(0, state.budget + ch.fx.b);
  const deltas = Object.entries(ch.fx).filter(([, v]) => v)
    .map(([k, v]) => `<span class="${v > 0 ? "up" : "down"}">${v > 0 ? "+" : ""}${v} ${STAT_LABELS[k]}</span>`).join("");
  const last = source === "crisis" && state.crisisIndex + 1 >= CRISES.length;
  screen.innerHTML = `
    <div class="card">
      <p class="kicker">Outcome</p>
      <p class="lead">${ch.result}</p>
      <p class="deltas">${deltas || "No change"}</p>
      <button class="btn primary" id="next">${source === "finale" ? "See your legacy →" : (last ? "Enter Phase 3 →" : "Next crisis →")}</button>
    </div>`;
  document.getElementById("next").onclick = () => {
    if (source === "finale") renderEnding();
    else if (last) renderFinaleIntro();
    else { state.crisisIndex++; renderCrisis(); }
  };
  renderAll();
}

function renderFinaleIntro() {
  state.phase = 3;
  screen.innerHTML = `
    <div class="card center">
      <p class="kicker">Phase 3 of 3</p>
      <h2>Legacy</h2>
      <p class="lead">All eyes are on you. One final decision will decide how history remembers your leadership.</p>
      <button class="btn primary" id="go">Make the final decision →</button>
    </div>`;
  document.getElementById("go").onclick = () => renderFinale();
  renderAll();
}

function renderFinale() {
  state.phase = 3;
  const roles = teamRoles();
  screen.innerHTML = `
    <div class="card">
      <p class="kicker">Phase 3 — The finale</p>
      <h2>${FINALE.title}</h2>
      <p class="lead">${FINALE.text}</p>
      <div class="choices" id="choices"></div>
    </div>`;
  const box = document.getElementById("choices");
  FINALE.choices.forEach(ch => {
    const has = ch.role && roles.has(ch.role);
    const btn = document.createElement("button");
    btn.className = "choice" + (ch.role && !has ? " locked" : "");
    btn.disabled = !!(ch.role && !has);
    btn.innerHTML = `${ch.text}${ch.role ? `<small>${has ? "Unlocked — your " + ROLE_NAMES[ch.role] + " advises this" : "Requires a " + ROLE_NAMES[ch.role] + " on your team"}</small>` : ""}`;
    btn.onclick = () => applyChoice(ch, "finale");
    box.appendChild(btn);
  });
  renderAll();
}

function renderEnding() {
  state.phase = 3;
  const score = clamp(state.morale) + clamp(state.trust) + clamp(state.rep);
  const end = ENDINGS.find(e => score >= e.min);
  const teamNames = state.team.map(id => CANDIDATES.find(c => c.id === id).name).join(", ");
  screen.innerHTML = `
    <div class="card center">
      <p class="kicker">Your legacy</p>
      <h2>${end.title}</h2>
      <p class="lead">${end.text}</p>
      <p class="score">Leadership score: <b>${score} / 300</b></p>
      <div class="final-stats">
        <span>Morale <b>${clamp(state.morale)}</b></span>
        <span>Trust <b>${clamp(state.trust)}</b></span>
        <span>Reputation <b>${clamp(state.rep)}</b></span>
        <span>Gold left <b>${state.budget}</b></span>
      </div>
      <p class="muted">Your team: ${teamNames}</p>
      <button class="btn primary" id="again">Play again</button>
    </div>`;
  document.getElementById("again").onclick = () => location.reload();
  renderAll();
}

renderAssemble();
</script>
</body>
</html>
