<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Lead — A Three-Phase Leadership Simulation</title>
<style>
:root {
  --bg: #0f1420;
  --panel: #171e2e;
  --panel-2: #1f2940;
  --text: #e8ecf4;
  --muted: #9aa7bd;
  --accent: #f0b429;
  --accent-2: #4f8cff;
  --good: #3ecf8e;
  --bad: #ff6b6b;
  --border: #2a3550;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  background: radial-gradient(1200px 600px at 50% -10%, #1d2a4a 0%, var(--bg) 60%);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 16px 48px;
}
header { text-align: center; margin-bottom: 18px; }
header h1 { font-size: 2rem; letter-spacing: 0.5px; }
header h1 span { color: var(--accent); }
header p { color: var(--muted); margin-top: 4px; }
#steps { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; justify-content: center; }
.step {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 14px; border: 1px solid var(--border); border-radius: 999px;
  color: var(--muted); font-size: 0.9rem; background: var(--panel);
}
.step .dot {
  width: 22px; height: 22px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--panel-2); border: 1px solid var(--border); font-size: 0.8rem;
}
.step.active { color: var(--text); border-color: var(--accent); }
.step.active .dot { background: var(--accent); color: #1a1a1a; border-color: var(--accent); font-weight: 700; }
.step.done { color: var(--good); }
.step.done .dot { background: var(--good); color: #0c1f16; border-color: var(--good); }
#stats {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px; width: 100%; max-width: 760px; margin-bottom: 14px;
}
.stat { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
.stat-head { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
.stat-head span:last-child { color: var(--text); font-weight: 600; }
.bar { height: 8px; background: var(--panel-2); border-radius: 999px; overflow: hidden; }
.fill { height: 100%; border-radius: 999px; transition: width 0.35s ease; }
#team {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 10px; width: 100%; max-width: 760px; margin-bottom: 14px;
}
.member { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
.member-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.member-top b { font-size: 0.92rem; }
.member .personality { font-size: 0.72rem; color: var(--accent-2); border: 1px solid var(--accent-2); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.member .need-label { font-size: 0.78rem; color: var(--muted); margin: 6px 0 4px; }
.member .need-label b { color: var(--accent); }
#screen { width: 100%; max-width: 760px; }
.card {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 16px; padding: 26px;
}
.card.center { text-align: center; }
.card h2 { margin-bottom: 10px; font-size: 1.4rem; }
.kicker { color: var(--accent); text-transform: uppercase; letter-spacing: 1.5px; font-size: 0.75rem; margin-bottom: 8px; }
.kicker.twist { color: var(--bad); }
.lead { color: var(--muted); line-height: 1.6; margin-bottom: 18px; }
.lead b { color: var(--text); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; margin-bottom: 18px; }
.cand {
  background: var(--panel-2); border: 1px solid var(--border); border-radius: 12px;
  padding: 14px; display: flex; flex-direction: column; gap: 6px;
}
.cand.picked { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.cand-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.need-tag { font-size: 0.72rem; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
.cand p { font-size: 0.85rem; color: var(--muted); flex: 1; }
.wage { color: var(--good) !important; font-size: 0.78rem !important; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
#pickinfo { color: var(--muted); font-size: 0.9rem; }
.btn {
  border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
  border-radius: 10px; padding: 10px 18px; font-size: 0.95rem; cursor: pointer;
  transition: transform 0.08s ease, background 0.15s ease;
}
.btn:hover:not(:disabled) { transform: translateY(-1px); background: #273252; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #1a1a1a; font-weight: 700; }
.btn.primary:hover:not(:disabled) { background: #ffc94d; }
.btn.small { padding: 7px 12px; font-size: 0.82rem; width: 100%; }
.btn.ghost { background: transparent; }
.choices { display: flex; flex-direction: column; gap: 10px; }
.choice {
  text-align: left; background: var(--panel-2); border: 1px solid var(--border);
  color: var(--text); border-radius: 12px; padding: 14px 16px; font-size: 0.95rem;
  cursor: pointer; display: flex; flex-direction: column; gap: 4px; line-height: 1.45;
  transition: border-color 0.15s ease, background 0.15s ease;
}
.choice:hover:not(:disabled) { border-color: var(--accent); background: #273252; }
.choice small { color: var(--accent-2); font-size: 0.78rem; }
.deltas { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.deltas span { border-radius: 999px; padding: 4px 12px; font-size: 0.82rem; border: 1px solid var(--border); }
.up { color: var(--good); }
.down { color: var(--bad); }
.score { font-size: 1.05rem; margin-bottom: 12px; }
.muted { color: var(--muted); font-size: 0.88rem; margin-bottom: 8px; }
.final-stats { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; margin-bottom: 14px; color: var(--muted); font-size: 0.9rem; }
.final-stats b { color: var(--text); }
footer { margin-top: 26px; color: var(--muted); font-size: 0.8rem; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Project <span>Lead</span></h1>
  <p>A three-phase leadership simulation — inspired by the publicly described mechanics of Workz's Playmakers® (an original work, not affiliated with Workz)</p>
</header>
<div id="steps"></div>
<div id="stats"></div>
<div id="team"></div>
<div id="screen"></div>
<footer>Recognise each team member's personality and need. Set shared goals. Balance the steering committee. Deliver.</footer>
<script>
const NEED_LABELS = { clarity: "Clarity", motivation: "Motivation", recognition: "Recognition" };
const NEED_COLORS = { clarity: "var(--accent-2)", motivation: "var(--accent)", recognition: "var(--good)" };
const STAT_LABELS = { budget: "Budget", morale: "Morale", trust: "Stakeholder trust", progress: "Progress" };
const STAT_COLORS = { budget: "var(--accent)", morale: "var(--good)", trust: "var(--accent-2)", progress: "var(--bad)" };

const CANDIDATES = [
  { id: "sara", name: "Sara Lind", personality: "The Analyst", need: "clarity", wage: 35, blurb: "Wants precise requirements and a clear plan before she moves." },
  { id: "milo", name: "Milo Grant", personality: "The Driver", need: "motivation", wage: 30, blurb: "Energised by ambitious goals and visible wins." },
  { id: "ada", name: "Ada Krom", personality: "The Supporter", need: "recognition", wage: 30, blurb: "Keeps the peace on the team — if she feels valued." },
  { id: "jonas", name: "Jonas Beck", personality: "The Innovator", need: "motivation", wage: 25, blurb: "Loves experimenting; frustrated by bureaucracy." },
  { id: "pia", name: "Pia Holm", personality: "The Perfectionist", need: "clarity", wage: 25, blurb: "Double-checks everything; hates vague briefs." },
  { id: "viktor", name: "Viktor Ade", personality: "The Pragmatist", need: "recognition", wage: 20, blurb: "Gets things done — and wants credit for it." }
];

const KICKOFF = {
  title: "Kickoff with the steering committee",
  text: "The committee wants the client portal 'Atlas' delivered in 12 weeks: full scope, on time, on budget. You set the shared goals for the project now.",
  choices: [
    { text: "Promise the full scope on time — commit fully.", fx: { trust: 10, progress: 5, morale: 4 }, result: "Bold. The committee approves — and the team believes in the ambition." },
    { text: "Promise full scope, but negotiate a 15 budget top-up.", fx: { budget: 15, trust: 4, morale: 2 }, result: "The committee funds it. More room to breathe — if you spend it well." },
    { text: "Set a realistic scope and negotiate more time.", fx: { trust: 6, morale: 3, progress: 2 }, result: "Honest planning calms the room. The deadline moves, the goal stays clear." }
  ]
};

const EVENTS = [
  {
    twist: true,
    title: "Surprise: the client doubles the feature list",
    text: "Halfway through, the client sends a new requirements document — twice as long. The project's character just changed.",
    choices: [
      { text: "Renegotiate the scope with the steering committee.", fx: { trust: 8, progress: -6, budget: -5 }, result: "Hard negotiation, but the goal is honest again and the committee respects you." },
      { text: "Tell the team to absorb it all — no excuses.", fx: { morale: -10, progress: 8, need: { motivation: -8 } }, result: "Progress jumps, but the team feels the squeeze." },
      { text: "Split it: core features now, the rest in a phase two.", fx: { trust: 4, morale: 4, progress: 2, need: { clarity: 6 } }, result: "A clear split keeps everyone aligned on what 'done' means." }
    ]
  },
  {
    title: "Open conflict in the team",
    text: "Two of your team members clash openly in a design review — strong personalities, different ideas, nobody backing down.",
    choices: [
      { text: "Mediate and set a clear decision-making process.", fx: { morale: 4, trust: 2, need: { clarity: 10 } }, result: "A shared process turns the clash into a debate. Clarity-needy members relax." },
      { text: "Let them resolve it themselves — it's their project.", fx: { morale: -4, trust: -2, progress: 2 }, result: "It gets solved, but the room stays tense afterwards." },
      { text: "Back the stronger argument publicly and move on.", fx: { morale: -6, progress: 4, need: { recognition: -8 } }, result: "Fast decision — but the one who lost feels unseen." }
    ]
  },
  {
    title: "The brief is vague again",
    text: "A key deliverable has no clear acceptance criteria. People are guessing what 'done' looks like.",
    choices: [
      { text: "Rewrite the brief together with clear acceptance criteria.", fx: { progress: 4, budget: -3, need: { clarity: 14 } }, result: "Everyone can now see the finish line. Clarity-needy members thrive." },
      { text: "Trust the team to use their judgment.", fx: { progress: -4, need: { clarity: -12 } }, result: "Autonomy sounds nice, but rework piles up later." },
      { text: "Give ownership of the spec to the most thorough member.", fx: { progress: 2, need: { clarity: 8, recognition: 6 } }, result: "Ownership plus praise — the spec is sharp and someone feels seen." }
    ]
  },
  {
    twist: true,
    title: "Surprise: a quiet team member",
    text: "In standup, one of your team has gone quiet. Their last contribution went uncredited in the release notes.",
    choices: [
      { text: "Give them a public shout-out at the next all-hands.", fx: { morale: 6, need: { recognition: 14 } }, result: "Recognition lands loudly. Recognition-needy members light up." },
      { text: "Acknowledge it privately in a one-on-one.", fx: { morale: 2, need: { recognition: 8 } }, result: "Quieter, but genuine. Some prefer it this way." },
      { text: "Say nothing — the work speaks for itself.", fx: { morale: -6, need: { recognition: -12 } }, result: "The silence is heard. The room cools." }
    ]
  },
  {
    twist: true,
    title: "Surprise: the budget is cut 20% mid-project",
    text: "Finance announces a company-wide cut. Your project loses a fifth of its remaining budget overnight.",
    choices: [
      { text: "Protect the team — cut external consultants instead.", fx: { budget: -20, morale: 6, progress: -4 }, result: "The team notices who you shielded. Loyalty deepens, momentum dips." },
      { text: "Ask everyone to trim their scope to fit.", fx: { budget: -10, morale: -4, progress: -6, need: { motivation: -6 } }, result: "Shared sacrifice — but ambition-needy members deflate." },
      { text: "Go back to the committee and negotiate it back.", fx: { budget: 10, trust: -6, morale: 2 }, result: "You win some budget back, but the committee remembers the push." }
    ]
  }
];

const FINALE = {
  title: "Delivery week — the final review",
  text: "Twelve weeks are gone. The steering committee sits across the table for the final review of Atlas. Goals were reformulated along the way; now the results are judged.",
  choices: [
    { text: "Present the results with data and ask for sign-off.", fx: { trust: 10, progress: 10 }, result: "Facts first. The committee signs off on a project they can measure." },
    { text: "Be honest about the compromises — and what you learned.", fx: { trust: 6, morale: 6, need: { recognition: 6 } }, result: "Vulnerability builds trust. The team hears you own the outcome." },
    { text: "Promise a follow-up release covering the gaps.", fx: { trust: 4, budget: -8, progress: 4 }, result: "A credible path forward — at a price." }
  ]
};

const ENDINGS = [
  { min: 320, title: "A high-performing team", text: "The project delivered on time and on budget — and the team became the benchmark the whole company copies. You recognised each person's needs and led accordingly. That is real project leadership." },
  { min: 240, title: "Delivered — on time and on budget", text: "Atlas shipped with quality intact. The committee is happy, the client is happy, and the team is proud. Solid leadership under pressure." },
  { min: 160, title: "Shipped, with lessons learned", text: "The project went out the door, but not without friction. Some needs went unmet and the stakeholders noticed. A leader still finding their style." },
  { min: 0, title: "The project struggled", text: "Deadlines slipped, morale sank, and the committee lost confidence. Every great leader starts somewhere — the team is still with you." }
];

const state = {
  phase: 1,
  budget: 100,
  morale: 50,
  trust: 50,
  progress: 10,
  team: [],
  eventIndex: 0
};
const screen = document.getElementById("screen");
const stepsEl = document.getElementById("steps");
const statsEl = document.getElementById("stats");
const teamEl = document.getElementById("team");

function clamp(v) { return Math.max(0, Math.min(100, v)); }
function memberById(id) { return CANDIDATES.find(c => c.id === id); }
function needMeter(id) { return state["meter_" + id]; }

function applyNeed(needFx) {
  if (!needFx) return;
  state.team.forEach(id => {
    const m = memberById(id);
    if (m.need === "clarity" && needFx.clarity) state["meter_" + id] = clamp(needMeter(id) + needFx.clarity);
    if (m.need === "motivation" && needFx.motivation) state["meter_" + id] = clamp(needMeter(id) + needFx.motivation);
    if (m.need === "recognition" && needFx.recognition) state["meter_" + id] = clamp(needMeter(id) + needFx.recognition);
  });
}

function renderSteps() {
  const names = ["Kickoff", "The Shift", "Delivery"];
  stepsEl.innerHTML = names.map((n, i) => {
    const p = i + 1;
    const cls = p === state.phase ? "step active" : (p < state.phase ? "step done" : "step");
    return `<div class="${cls}"><span class="dot">${p < state.phase ? "✓" : p}</span>${n}</div>`;
  }).join("");
}

function renderStats() {
  statsEl.innerHTML = ["budget", "morale", "trust", "progress"].map(k => {
    const v = k === "budget" ? state.budget : clamp(state[k]);
    const pct = k === "budget" ? Math.min(100, state.budget) : v;
    return `<div class="stat"><div class="stat-head"><span>${STAT_LABELS[k]}</span><span>${v}</span></div>
      <div class="bar"><div class="fill" style="width:${pct}%;background:${STAT_COLORS[k]}"></div></div></div>`;
  }).join("");
}

function renderTeam() {
  if (!state.team.length) { teamEl.innerHTML = ""; return; }
  teamEl.innerHTML = state.team.map(id => {
    const m = memberById(id);
    const meter = clamp(needMeter(id));
    return `<div class="member">
      <div class="member-top"><b>${m.name}</b><span class="personality">${m.personality}</span></div>
      <div class="need-label">Needs <b>${NEED_LABELS[m.need]}</b> — <span>${meter}</span></div>
      <div class="bar"><div class="fill" style="width:${meter}%;background:${NEED_COLORS[m.need]}"></div></div>
    </div>`;
  }).join("");
}

function renderAll() { renderSteps(); renderStats(); renderTeam(); }

function renderAssemble() {
  state.phase = 1;
  screen.innerHTML = `
    <div class="card">
      <p class="kicker">Phase 1 of 3 — Kickoff</p>
      <h2>Assemble your project team</h2>
      <p class="lead">You are the new leader of a small team delivering the client portal <b>Atlas</b> in 12 weeks, with a budget of <b>${state.budget}</b>. Pick <b>exactly 3</b> team members. Everyone has a personality — and a core need for <b>clarity</b>, <b>motivation</b> or <b>recognition</b>. Recognise it, and respond.</p>
      <div class="grid" id="candidates"></div>
      <div class="row">
        <span id="pickinfo">Picked ${state.team.length} / 3 — budget ${state.budget}</span>
        <button id="start2" class="btn primary" ${state.team.length === 3 ? "" : "disabled"}>Hold the kickoff meeting →</button>
      </div>
    </div>`;
  const grid = document.getElementById("candidates");
  CANDIDATES.forEach(c => {
    const picked = state.team.includes(c.id);
    const afford = picked || c.wage <= state.budget;
    const card = document.createElement("div");
    card.className = "cand" + (picked ? " picked" : "");
    card.innerHTML = `
      <div class="cand-top"><b>${c.name}</b><span class="need-tag">Needs ${NEED_LABELS[c.need]}</span></div>
      <p><i>${c.personality}</i> — ${c.blurb}</p>
      <p class="wage">Wage: ${c.wage}</p>
      <button class="btn ${picked ? "ghost" : "small"}" ${afford ? "" : "disabled"}>
        ${picked ? "Remove — refund " + c.wage : "Hire — " + c.wage}
      </button>`;
    card.querySelector("button").onclick = () => {
      if (state.team.includes(c.id)) {
        state.team = state.team.filter(id => id !== c.id);
        state.budget += c.wage;
        delete state["meter_" + c.id];
      } else {
        state.team.push(c.id);
        state.budget -= c.wage;
        state["meter_" + c.id] = 60;
      }
      renderAssemble();
      renderAll();
    };
    grid.appendChild(card);
  });
  document.getElementById("start2").onclick = () => renderEvent("kickoff");
  renderAll();
}

function renderEvent(source) {
  const data = source === "kickoff" ? KICKOFF : EVENTS[state.eventIndex];
  state.phase = source === "kickoff" ? 1 : 2;
  screen.innerHTML = `
    <div class="card">
      <p class="kicker${data.twist ? " twist" : ""}">${source === "kickoff" ? "Phase 1 — Kickoff" : "Phase 2 — Event " + (state.eventIndex + 1) + " of " + EVENTS.length}${data.twist ? " — ⚠ unforeseen event" : ""}</p>
      <h2>${data.title}</h2>
      <p class="lead">${data.text}</p>
      <div class="choices" id="choices"></div>
    </div>`;
  const box = document.getElementById("choices");
  data.choices.forEach(ch => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = `${ch.text}${ch.hint ? `<small>${ch.hint}</small>` : ""}`;
    btn.onclick = () => applyChoice(ch, source);
    box.appendChild(btn);
  });
  renderAll();
}

function deltaChips(fx) {
  const chips = [];
  ["budget", "morale", "trust", "progress"].forEach(k => {
    if (fx[k]) chips.push(`<span class="${fx[k] > 0 ? "up" : "down"}">${fx[k] > 0 ? "+" : ""}${fx[k]} ${STAT_LABELS[k]}</span>`);
  });
  if (fx.need) Object.entries(fx.need).forEach(([n, v]) => {
    if (v) chips.push(`<span class="${v > 0 ? "up" : "down"}">${v > 0 ? "+" : ""}${v} ${NEED_LABELS[n]} (for ${NEED_LABELS[n]}-needy members)</span>`);
  });
  return chips.join("") || "No change";
}

function applyChoice(ch, source) {
  ["morale", "trust", "progress"].forEach(k => { if (ch.fx[k]) state[k] = clamp(state[k] + ch.fx[k]); });
  if (ch.fx.budget) state.budget = Math.max(0, state.budget + ch.fx.budget);
  applyNeed(ch.fx.need);
  const lastEvent = source === "event" && state.eventIndex + 1 >= EVENTS.length;
  screen.innerHTML = `
    <div class="card">
      <p class="kicker">Consequence</p>
      <p class="lead">${ch.result}</p>
      <p class="deltas">${deltaChips(ch.fx)}</p>
      <button class="btn primary" id="next">${
        source === "finale" ? "See the final results →" :
        source === "kickoff" ? "Enter Phase 2 →" :
        lastEvent ? "Enter Phase 3 →" : "Next event →"
      }</button>
    </div>`;
  document.getElementById("next").onclick = () => {
    if (source === "finale") renderEnding();
    else if (source === "kickoff") { state.eventIndex = 0; renderPhase2Intro(); }
    else if (lastEvent) renderFinaleIntro();
    else { state.eventIndex++; renderEvent("event"); }
  };
  renderAll();
}

function renderPhase2Intro() {
  state.phase = 2;
  screen.innerHTML = `
    <div class="card center">
      <p class="kicker">Phase 2 of 3</p>
      <h2>The project shifts</h2>
      <p class="lead">The project's character changes as progress is made. <b>Unforeseen events</b> will challenge your plans, goals get reformulated, and the steering committee is always watching. Respond to your team's individual needs — that is where leadership lives.</p>
      <button class="btn primary" id="go">Face the first event →</button>
    </div>`;
  document.getElementById("go").onclick = () => renderEvent("event");
  renderAll();
}

function renderFinaleIntro() {
  state.phase = 3;
  screen.innerHTML = `
    <div class="card center">
      <p class="kicker">Phase 3 of 3</p>
      <h2>Delivery</h2>
      <p class="lead">The final stretch. Negotiate with the steering committee, protect your team, and deliver Atlas with quality — on time and on budget.</p>
      <button class="btn primary" id="go">Go to the final review →</button>
    </div>`;
  document.getElementById("go").onclick = () => renderEvent("finale");
  renderAll();
}

function avgNeed() {
  if (!state.team.length) return 0;
  return Math.round(state.team.reduce((s, id) => s + clamp(needMeter(id)), 0) / state.team.length);
}

function renderEnding() {
  state.phase = 3;
  const need = avgNeed();
  const score = need + clamp(state.morale) + clamp(state.trust) + clamp(state.progress);
  const end = ENDINGS.find(e => score >= e.min);
  screen.innerHTML = `
    <div class="card center">
      <p class="kicker">Final results</p>
      <h2>${end.title}</h2>
      <p class="lead">${end.text}</p>
      <p class="score">Leadership score: <b>${score} / 400</b></p>
      <div class="final-stats">
        <span>Team needs met <b>${need}</b></span>
        <span>Morale <b>${clamp(state.morale)}</b></span>
        <span>Stakeholder trust <b>${clamp(state.trust)}</b></span>
        <span>Progress <b>${clamp(state.progress)}</b></span>
        <span>Budget left <b>${state.budget}</b></span>
      </div>
      <div class="muted">${state.team.map(id => {
        const m = memberById(id);
        return `${m.name} (${m.personality}, needs ${NEED_LABELS[m.need]}): ${clamp(needMeter(id))}`;
      }).join(" · ")}</div>
      <button class="btn primary" id="again">Play again</button>
    </div>`;
  document.getElementById("again").onclick = () => location.reload();
  renderAll();
}

renderAssemble();
</script>
</body>
</html>
